name: vervio

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      # Defaults to the untracked local file. Override BACKEND_ENV_FILE with
      # backend/.env.example for secret-safe Compose syntax validation.
      - ${BACKEND_ENV_FILE:-./backend/.env}
    environment:
      PORT: "8000"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
